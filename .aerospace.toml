# ==============================================================================
# 0. CORE AEROSPACE CONFIGURATION
# ==============================================================================

# Reference: https://github.com/i3/i3/blob/next/etc/config

# Config version for compatibility
config-version = 2

# Start AeroSpace at login
start-at-login = true

# Workspaces Model (i3-like: Workspaces are "phantom" and created/destroyed on demand)
persistent-workspaces = []

# Normalizations (AeroSpace's Auto-Tidying Feature)
# Original setting: These are disabled for i3 compatibility.
enable-normalization-flatten-containers = false
enable-normalization-opposite-orientation-for-nested-containers = false

# ==============================================================================
# 1. AESTHETICS & BEHAVIOR
# ==============================================================================

# Mouse follows focus when focused monitor changes
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# after-startup-command = [
#   'exec-and-forget borders active_color=0xff5de4e7 inactive_color=0xff494d64 width=10.0'
# ]

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# NB: the [gaps] table lives at the BOTTOM of this file. In TOML, every
# top-level key after a table header belongs to that table, so [gaps] must come
# after the top-level 'on-window-detected' array below.


# ==============================================================================
# 2. APPLICATION RULES (ON-WINDOW-DETECTED CALLBACKS)
#
# These rules apply the 'layout floating' command when specific applications
# are detected, ensuring they do not tile automatically.
#
# Fires once per *newly detected* window only — never on focus, reveal, or
# manual moves. So a window you move by hand afterwards stays where you put it.
# See: https://nikitabobko.github.io/AeroSpace/guide#on-window-detected-callback
#
# Evaluated top-down; the FIRST matching object wins and the rest are skipped.
# Add 'check-further-callbacks = true' to an object to keep the list going.
# ==============================================================================

on-window-detected = [
    # --- Fixed workspace assignments ------------------------------------------
    # Applied once, when the window is first detected. Move a window by hand
    # afterwards and it stays put; a *second* window of the same app still
    # lands here, and 'reload-config' re-applies these to all open windows.
    { if = 'test %{app-bundle-id} = com.brave.Browser.origin',      run = 'move-node-to-workspace 1' },
    { if = 'test %{app-bundle-id} = com.mitchellh.ghostty',         run = 'move-node-to-workspace 2' },
    { if = 'test %{app-bundle-id} = com.spotify.client',            run = 'move-node-to-workspace 3' },
    { if = 'test %{app-bundle-id} = org.jkiss.dbeaver.core.product', run = 'move-node-to-workspace 4' },

    # --- Force-float utility windows ------------------------------------------
    { if = 'test %{app-bundle-id} = com.apple.finder',            run = 'layout floating' },
    { if = 'test %{app-bundle-id} = com.apple.systempreferences', run = 'layout floating' },
    { if = 'test %{app-bundle-id} = net.whatsapp.WhatsApp',       run = 'layout floating' },
    { if = 'test %{app-bundle-id} = com.culturedcode.ThingsMac',  run = 'layout floating' },
    { if = 'test %{app-bundle-id} = cc.ffitch.shottr',            run = 'layout floating' },
    { if = 'test %{app-bundle-id} = ru.keepcoder.Telegram',       run = 'layout floating' },
    { if = 'test %{app-bundle-id} = com.apple.iCal',              run = 'layout floating' },
    { if = 'test %{app-bundle-id} = com.amazon.Lassen',           run = 'layout floating' },
    { if = 'test %{app-bundle-id} = com.granola.app',             run = 'layout floating' },
    { if = 'test %{app-bundle-id} = com.apple.ActivityMonitor',   run = 'layout floating' },
    { if = 'test %{app-bundle-id} = net.freemacsoft.AppCleaner',  run = 'layout floating' },
    { if = 'test %{app-bundle-id} = com.1password.1password',     run = 'layout floating' },
    { if = 'test %{app-bundle-id} = com.apple.MobileSMS',         run = 'layout floating' },
    { if = 'test %{app-bundle-id} = app.soulver.mac',             run = 'layout floating' },
    { if = 'test %{app-bundle-id} = com.max-langer.Latest',       run = 'layout floating' },
    { if = 'test %{app-bundle-id} = com.bitwarden.desktop',       run = 'layout floating' },
    { if = 'test %{app-bundle-id} = com.apple.Preview',           run = 'layout floating' },
    { if = 'test %{app-bundle-id} = ch.sudo.cyberduck',           run = 'layout floating' },
    { if = 'test %{app-bundle-id} = io.ente.auth.mac',            run = 'layout floating' },
    { if = 'test %{app-bundle-id} = com.stonerl.Thaw',            run = 'layout floating' },
    { if = 'test %{app-bundle-id} = com.getupnote.desktop',       run = 'layout floating' },
]

# ==============================================================================
# 3. KEYBINDING MODES
# ==============================================================================

[mode.main.binding]
    # --------------------------------------------------------------------------
    # 3.1. FOCUS AND MOVEMENT (HJKL/I3 STYLE)
    # --------------------------------------------------------------------------

    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    # --------------------------------------------------------------------------
    # 3.2. RESIZE COMMANDS
    # --------------------------------------------------------------------------

    # See: https://nikitabobko.github.io/AeroSpace/commands#resize
    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'

    # --------------------------------------------------------------------------
    # 3.3. LAYOUT & SPLIT COMMANDS
    # --------------------------------------------------------------------------

    # Manual Split Orientation (Commented out, preserving original state)
    # Consider using 'join-with' command as a 'split' replacement if you want to enable
    # normalizations
    alt-c = 'split horizontal'
    alt-v = 'split vertical'

    # Layout toggles
    alt-shift-enter = 'fullscreen'
    alt-2 = 'layout v_accordion' # 'layout stacking' in i3
    alt-3 = 'layout h_accordion' # 'layout tabbed' in i3
    alt-1 = 'layout tiles horizontal vertical' # 'layout toggle split' in i3

    # Floating toggle
    alt-shift-space = 'layout floating tiling' # 'floating toggle' in i3

    # --------------------------------------------------------------------------
    # 3.4. WORKSPACE SWITCHING
    # --------------------------------------------------------------------------

    # Switch to workspace 1-10
    alt-a = 'workspace 1'
    alt-s = 'workspace 2'
    alt-d = 'workspace 3'
    alt-f = 'workspace 4'
    alt-g = 'workspace 5'
    alt-y = 'workspace 6'
    alt-u = 'workspace 7'
    alt-i = 'workspace 8'
    alt-o = 'workspace 9'
    alt-p = 'workspace 10'

    # Move focused window to workspace 1-10
    alt-shift-a = 'move-node-to-workspace 1'
    alt-shift-s = 'move-node-to-workspace 2'
    alt-shift-d = 'move-node-to-workspace 3'
    alt-shift-f = 'move-node-to-workspace 4'
    alt-shift-g = 'move-node-to-workspace 5'
    alt-shift-y = 'move-node-to-workspace 6'
    alt-shift-u = 'move-node-to-workspace 7'
    alt-shift-i = 'move-node-to-workspace 8'
    alt-shift-o = 'move-node-to-workspace 9'
    alt-shift-p = 'move-node-to-workspace 10'

    # Sequential Workspace Navigation
    alt-comma = 'workspace prev'
    alt-period = 'workspace next'

    # --------------------------------------------------------------------------
    # 3.5. UTILITY COMMANDS
    # --------------------------------------------------------------------------

    alt-shift-semicolon = 'reload-config'

    # App launchers (new window)
    alt-shift-t = 'exec-and-forget open -n -a Ghostty'
    alt-shift-b = 'exec-and-forget open -n -a "Brave Browser"'

    cmd-h = [] # Disable "hide application"
    cmd-alt-h = [] # Disable "hide others"


# ==============================================================================
# 4. GAPS
#
# Kept last: TOML assigns any following top-level key to the preceding table,
# so all table headers must come after the top-level keys in section 1 and 2.
# ==============================================================================

[gaps]
    inner.horizontal = 10
    inner.vertical =   10
    outer.left =       5
    outer.bottom =     5
    outer.top =        5
    outer.right =      5
