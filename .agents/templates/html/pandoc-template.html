<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title$</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css">
<style>
  :root {
    --bg: #0f1115; --fg: #e6e6e6; --muted: #9aa3af; --accent: #7aa2f7;
    --panel: #161922; --border: #262b36; --code-bg: #1a1d27;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#fff; --fg:#1a1a1a; --muted:#666; --accent:#2563eb; --panel:#f7f7f8; --border:#e5e7eb; --code-bg:#f3f4f6; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--fg); }
  .layout { display:grid; grid-template-columns: 260px 1fr; min-height:100vh; }
  nav.toc { position:sticky; top:0; align-self:start; max-height:100vh; overflow:auto; padding:24px 18px; background:var(--panel); border-right:1px solid var(--border); font-size:14px; }
  nav.toc h2 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:0 0 12px; }
  nav.toc ul { list-style:none; padding:0; margin:0; }
  nav.toc li { margin:4px 0; }
  nav.toc a { color:var(--fg); text-decoration:none; opacity:.85; }
  nav.toc a:hover { color:var(--accent); }
  nav.toc ul ul { padding-left:14px; border-left:1px solid var(--border); margin-top:4px; }
  main { padding:48px 56px; max-width:920px; }
  h1,h2,h3,h4 { line-height:1.25; }
  h1 { font-size:2rem; margin-top:0; }
  h2 { font-size:1.5rem; margin-top:2.5rem; padding-bottom:.3rem; border-bottom:1px solid var(--border); }
  h3 { font-size:1.2rem; margin-top:2rem; }
  a { color:var(--accent); }
  code { background:var(--code-bg); padding:2px 6px; border-radius:4px; font-size:.9em; }
  pre { background:var(--code-bg); padding:16px; border-radius:8px; overflow:auto; border:1px solid var(--border); }
  pre code { background:none; padding:0; }
  table { border-collapse:collapse; width:100%; margin:1em 0; }
  th, td { border:1px solid var(--border); padding:8px 12px; text-align:left; }
  th { background:var(--panel); }
  blockquote { border-left:3px solid var(--accent); padding:4px 16px; color:var(--muted); margin:1em 0; background:var(--panel); }
  ul.task-list { list-style:none; padding-left:0; }
  ul.task-list li { padding-left:28px; position:relative; margin:6px 0; }
  ul.task-list input[type=checkbox] { position:absolute; left:0; top:6px; width:16px; height:16px; accent-color:var(--accent); }
  details { background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:8px 14px; margin:1em 0; }
  details summary { cursor:pointer; font-weight:600; }
  .mermaid { background:var(--panel); padding:16px; border-radius:8px; border:1px solid var(--border); }
  .meta { color:var(--muted); font-size:.9em; margin-bottom:2rem; }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    nav.toc { position:static; max-height:none; border-right:none; border-bottom:1px solid var(--border); }
    main { padding:24px; }
  }
</style>
</head>
<body>
<div class="layout">
  <nav class="toc">
    <h2>Contents</h2>
    $toc$
  </nav>
  <main>
    <h1>$title$</h1>
    $if(date)$<div class="meta">$date$</div>$endif$
    $body$
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-core.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";
  mermaid.initialize({ startOnLoad: true, theme: matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'default' });
  document.querySelectorAll('pre > code.language-mermaid').forEach(el => {
    const div = document.createElement('div');
    div.className = 'mermaid';
    div.textContent = el.textContent;
    el.parentElement.replaceWith(div);
  });
  mermaid.run();
  // persist checkbox state
  const key = 'tasks:' + location.pathname;
  const state = JSON.parse(localStorage.getItem(key) || '{}');
  document.querySelectorAll('ul.task-list input[type=checkbox]').forEach((cb, i) => {
    cb.disabled = false;
    if (state[i] !== undefined) cb.checked = state[i];
    cb.addEventListener('change', () => {
      state[i] = cb.checked;
      localStorage.setItem(key, JSON.stringify(state));
    });
  });
</script>
</body>
</html>
