# herdr configuration — symlinked to ~/.config/herdr/config.toml by setup.sh
# Full option reference: herdr --default-config  (or https://herdr.dev/docs/configuration/)

# Show first-run onboarding on startup. Disabled — already set up.
onboarding = false

[theme]
name = "catppuccin"

[terminal]
# default_shell = ""        # empty = $SHELL then /bin/sh
# shell_mode = "auto"       # auto | login | non_login
# new_cwd = "follow"        # follow | home | current | /fixed/path

[update]
channel = "stable"        # stable | preview

[keys]
prefix = "ctrl+s"
next_workspace = "option+]"
previous_workspace = "option+["
next_tab = "option+shift+]"
previous_tab = "option+shift+["

switch_workspace = "prefix+shift+1..9"
detach = "prefix+q"
workspace_picker = "prefix+w"
goto = "prefix+g"
new_workspace = "prefix+shift+n"
new_worktree = "prefix+shift+g"
rename_workspace = "prefix+shift+w"
close_workspace = "prefix+shift+d"
navigate_workspace_up = "up"
navigate_workspace_down = "down"
navigate_pane_left = "h"
navigate_pane_down = "j"
navigate_pane_up = "k"
navigate_pane_right = "l"
new_tab = "prefix+c"
switch_tab = "prefix+1..9"
rename_tab = "prefix+shift+t"
close_tab = "prefix+shift+x"
copy_mode = "prefix+["
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
cycle_pane_next = "prefix+tab"
cycle_pane_previous = "prefix+shift+tab"
last_pane = ""
split_vertical = "prefix+/"
split_horizontal = "prefix+-"
close_pane = "prefix+x"
zoom = "prefix+z"
resize_mode = "prefix+r"
toggle_sidebar = "prefix+b"


[ui]
agent_panel_scope = "all"   # current | all
prompt_new_tab_name = false
mouse_capture = true
confirm_close = true
sidebar_width = 32
sidebar_min_width = 18
sidebar_max_width = 36

[ui.toast]
delivery = "herdr"          # in-app toast, click-to-focus target pane; off | herdr | terminal | system

[ui.sound]
enabled = true

[session]
resume_agents_on_restore = true

[worktrees]
directory = "~/.herdr/worktrees"

[advanced]
scrollback_limit_bytes = 10485760
