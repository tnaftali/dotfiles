# Neutral by day, warm at night. The Screen Temperature plugin follows these profiles.
# Day uses temperature = 6500, not identity = true: the plugin reads identity back as the previous warm value.
profile {
    time = 07:00
    temperature = 6500
}
profile {
    time = 20:00
    temperature = 4000
}

# To enable auto switch to nightlight, add to your .config/hypr/autostart.lua:
# o.launch_on_start("hyprsunset")
# and use the following:
# profile {
#     time = 20:00
#     temperature = 4000
# }
